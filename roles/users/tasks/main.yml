---
- name: Ensure required groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ user_groups }}"

- name: Ensure managed users exist
  ansible.builtin.user:
    name: "{{ item.username }}"
    groups: "{{ item.groups | join(',') }}"
    append: true
    shell: /bin/bash
    create_home: true
    state: present
  loop: "{{ managed_accounts }}"

- name: Deploy authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.username }}"
    state: present
    key: "{{ lookup('file', 'devops_id_rsa.pub') }}"
  loop: "{{ managed_accounts }}"

- name: Configure sudoers for privileged users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.username }}"
    content: "{{ item.username }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ managed_accounts }}"
  when: item.sudo

- name: Ensure Company_Share directory exists
  ansible.builtin.file:
    path: "/home/{{ item.username }}/Company_Share"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.groups[0] }}"
    mode: '0755'
  loop: "{{ managed_accounts }}"
