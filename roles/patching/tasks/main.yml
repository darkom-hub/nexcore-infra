---
- name: Ensure maintenance packages are installed
  ansible.builtin.package:
    name:
      - dnf-plugins-core
      - "{{ automatic_updates_package }}"
    state: present

- name: Deploy health check script
  ansible.builtin.template:
    src: nexcore-health-check.sh.j2
    dest: "{{ health_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: Configure dnf-automatic
  ansible.builtin.lineinfile:
    path: /etc/dnf/automatic.conf
    regexp: '^apply_updates ='
    line: "apply_updates = {{ 'yes' if automatic_updates_apply else 'no' }}"

- name: Enable dnf-automatic timer
  ansible.builtin.service:
    name: dnf-automatic.timer
    enabled: true
    state: started

- name: Ensure health log file exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ health_log_file }}"
    force: false
    owner: root
    group: root
    mode: '0644'

- name: Configure daily health check cron job
  ansible.builtin.cron:
    name: "NexCore daily health check"
    minute: "0"
    hour: "{{ health_check_hour }}"
    job: "{{ health_script_path }}"

- name: Deploy logrotate configuration for health log
  ansible.builtin.template:
    src: nexcore-health-logrotate.j2
    dest: /etc/logrotate.d/nexcore-health
    owner: root
    group: root
    mode: '0644'
