---
- name: Ensure MariaDB packages are installed
  ansible.builtin.package:
    name: "{{ mariadb_packages }}"
    state: present

- name: Ensure MariaDB service is enabled and running
  ansible.builtin.service:
    name: "{{ mariadb_service }}"
    enabled: true
    state: started

- name: Open MariaDB service in firewalld
  ansible.posix.firewalld:
    service: mysql
    permanent: true
    state: enabled
    immediate: true

- name: Configure MariaDB bind address
  ansible.builtin.lineinfile:
    path: /etc/my.cnf.d/mariadb-server.cnf
    regexp: '^#?bind-address'
    line: "bind-address={{ mariadb_bind_address }}"
    create: true
  notify: Restart mariadb

- name: Check if wordpress database exists
  ansible.builtin.shell: |
    mysql -NBe "SHOW DATABASES LIKE '{{ wordpress_database.name }}';"
  register: wordpress_db_check
  changed_when: false

- name: Create wordpress database
  ansible.builtin.command:
    cmd: >
      mysql -e "CREATE DATABASE {{ wordpress_database.name }};"
  when: wordpress_db_check.stdout != wordpress_database.name

- name: Check if mediawiki database exists
  ansible.builtin.shell: |
    mysql -NBe "SHOW DATABASES LIKE '{{ mediawiki_database.name }}';"
  register: mediawiki_db_check
  changed_when: false

- name: Create mediawiki database
  ansible.builtin.command:
    cmd: >
      mysql -e "CREATE DATABASE {{ mediawiki_database.name }};"
  when: mediawiki_db_check.stdout != mediawiki_database.name
