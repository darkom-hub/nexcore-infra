---
- name: Ensure firewalld is installed
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Ensure firewalld service is enabled and running
  ansible.builtin.service:
    name: firewalld
    enabled: true
    state: started

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication'
    line: "PasswordAuthentication {{ ssh_password_authentication }}"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: "PermitRootLogin {{ ssh_permit_root_login }}"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

- name: Gather SELinux facts
  ansible.builtin.setup:
    filter: ansible_selinux

- name: Verify SELinux is enforcing
  ansible.builtin.assert:
    that:
      - ansible_selinux.status == "enabled"
      - ansible_selinux.mode == selinux_required_state
    fail_msg: "SELinux is not enforcing"
    success_msg: "SELinux is enforcing"
