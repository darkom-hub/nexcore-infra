---
- name: Base system configuration
  hosts: managed
  become: true

  roles:
    - role: users
      tags: users

    - role: security
      tags: security

    - role: patching
      tags: patching

    - role: logging
      tags: logging

- name: Configure storage and NFS services
  hosts: serverb
  become: true

  roles:
    - role: storage
      tags: storage

    - role: automount
      tags: automount

- name: Configure database services
  hosts: db
  become: true

  roles:
    - role: database
      tags: database

- name: Configure DNS, web and email services
  hosts: servera
  become: true

  roles:
    - role: dns
      tags: dns

    - role: web
      tags: web

    - role: email
      tags: email
